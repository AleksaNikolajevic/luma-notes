name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notes_test
          POSTGRES_USER: notes_test
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notes_test -d notes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          DATABASE_URL: postgresql://notes_test:ci-only-database-password@127.0.0.1:5432/notes_test
          TEST_DATABASE_URL: postgresql://notes_test:ci-only-database-password@127.0.0.1:5432/notes_test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end test
        env:
          DATABASE_URL: postgresql://notes_test:ci-only-database-password@127.0.0.1:5432/notes_test
          PUBLIC_ORIGIN: http://127.0.0.1:5173
          COOKIE_SECURE: "false"
          TRUST_PROXY_HOPS: "0"
          REGISTRATION_MODE: open
        run: |
          pnpm db:migrate
          pnpm test:e2e

      - name: Validate Compose
        env:
          PUBLIC_ORIGIN: https://notes.example.com
          TRUST_PROXY_HOPS: "2"
        run: |
          mkdir -p .secrets
          printf 'ci-only-admin-secret-not-for-production' > .secrets/postgres_admin_password
          printf 'ci-only-application-secret-not-for-production' > .secrets/postgres_app_password
          docker compose config --quiet
